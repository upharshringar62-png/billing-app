<script>
// ================= DATA - FIXED =================
let categories = JSON.parse(localStorage.getItem('localCategories')) || [
  {id:'all', name:'All Items'},
  {id:'1', name:'Shringar box'},
  {id:'2', name:'Face Wash'},
  {id:'3', name:'Derma Products'},
  {id:'4', name:'Hair Fall Control'},
  {id:'5', name:'Bangles'},
  {id:'6', name:'Serum'},
  {id:'7', name:'Flower Pot 3pcs'},
  {id:'8', name:'Sefty Pin'},
  {id:'9', name:'Bindi'},
  {id:'10', name:'Juda Pins'}
];
window.categories = categories;
window.products = JSON.parse(localStorage.getItem('localProducts')) || [];
let cart = {};
let selectedCat = 'all';
let searchText = '';
let longPressTimer = null;

function saveLocal(){
  localStorage.setItem('localProducts', JSON.stringify(window.products));
  localStorage.setItem('localCategories', JSON.stringify(window.categories));
}

function showActionModal(id){ if(confirm('Product delete karna hai?')) deleteProductById(id); }

// ================= RENDER CATEGORIES - FIXED =================
function renderCategories(){
  const el=document.getElementById('catList');
  if(!el) return;
  el.innerHTML='';
  (window.categories||[]).forEach(c=>{
    const count=(window.products||[]).filter(p=>String(p.cat)===String(c.id) || (c.id==='all')).length;
    const div=document.createElement('div');
    div.className='flex items-center justify-between px-3 py-3 border-b hover:bg-gray-50 cursor-pointer '+(selectedCat===c.id?'bg-blue-50':'');
    div.innerHTML=`<div><div class="text-[13px] font-medium">${c.name}</div><div class="text-[11px] text-gray-400">(${c.id==='all'?(window.products||[]).length:count}.0)</div></div><button onclick="event.stopPropagation(); deleteCategory('${c.id}')" class="w-6 h-6 text-gray-400 text-[16px]">...</button>`;
    div.onclick=()=>{selectedCat=c.id; renderProducts(); renderCategories();};
    el.appendChild(div);
  });
}

// ================= RENDER PRODUCTS - GREEN HIGHLIGHT PHOTO 2 JAISA =================
function renderProducts(){
  const grid=document.getElementById('productGrid');
  if(!grid) return;
  grid.innerHTML='';
  let list=window.products||[];
  let filtered=list.filter(p=>{
    if(selectedCat!=='all' && String(p.cat)!==String(selectedCat)) return false;
    if(searchText && !String(p.name||'').toLowerCase().includes(searchText.toLowerCase())) return false;
    return true;
  });
  filtered.forEach(p=>{
    const qty=cart[p.id]||0;
    const isSelected=qty>0;
    const card=document.createElement('div');
    card.className=(isSelected?'bg-[#c6f6c5] border-green-500 ':'bg-white border-gray-200 ')+'rounded-xl border-2 p-2 flex flex-col relative min-h-[185px] cursor-pointer transition-all';
    card.innerHTML=`
      <div class="flex justify-between">
        <div class="border border-dashed rounded-lg px-2 py-1 text-[13px] font-bold bg-white">₹ ${Number(p.price||0).toFixed(1)}</div>
        <div class="border border-dashed rounded-lg px-2 py-1 text-[13px] font-bold bg-white">${qty}</div>
      </div>
      <div class="flex-1 flex items-center justify-center my-2 min-h-[70px]">
        ${p.img?`<img src="${p.img}" class="w-full h-full object-cover rounded-lg max-h-[80px]">`:`<div class="w-[80px] h-[80px] bg-[#f6f7ff] rounded-lg flex items-center justify-center text-[30px]">🖼️</div>`}
      </div>
      <div class="text-[14px] font-bold text-center min-h-[36px] leading-tight">${p.name}</div>
      <div class="flex justify-between items-center mt-2">
        <button onclick="event.stopPropagation(); showActionModal('${p.id}')" class="w-6 h-6 text-[16px]">⋮</button>
        <button onclick="event.stopPropagation(); deleteProductById('${p.id}')" class="w-6 h-6 border border-black rounded text-[10px] font-bold">X</button>
      </div>
    `;
    card.onclick=()=>incQty(p.id);
    grid.appendChild(card);
  });
  const newCard=document.createElement('div');
  newCard.className='bg-white rounded-xl border-2 border-dashed border-blue-400 p-2 flex flex-col items-center justify-center min-h-[185px] cursor-pointer active:bg-blue-50';
  newCard.style.pointerEvents='auto';
  newCard.innerHTML=`<div class="w-16 h-16 rounded-full border-2 border-blue-500 flex items-center justify-center text-blue-500 text-[32px]">+</div><div class="text-[14px] font-bold mt-3 text-blue-600">NEW ITEM</div>`;
  newCard.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); addNewItemInCat(); });
  newCard.addEventListener('touchend', (e)=>{ e.preventDefault(); addNewItemInCat(); });
  grid.appendChild(newCard);
}

// ================= PRODUCT ADD - FIXED REFRESH BUG =================
function addProductWithCategory(){
  let list=window.categories.map((c,i)=>`${i+1}. ${c.name}`).join('\n');
  let choice=prompt('Kis Category me add karna hai?\n\n'+list+'\n\nNumber likho:');
  if(!choice) return;
  let idx=parseInt(choice)-1;
  if(idx<0||idx>=window.categories.length) return;
  let target=window.categories[idx].id;
  if(target==='all') target='1';
  let name=prompt('Product name:'); if(!name) return;
  let price=prompt('Price:','20'); if(!price) return;
  let obj={id:Date.now().toString(), name:name, price:parseFloat(price)||20, cat:target, qty:0, img:''};
  window.products.push(obj);
  saveLocal();
  if(window.firebaseAddProduct) window.firebaseAddProduct(obj);
  renderProducts(); renderCategories();
}
function addItemDirect(){
  let catName=window.categories.find(c=>c.id===selectedCat)?.name||'All';
  if(selectedCat==='all') catName='Shringar box';
  let name=prompt(`Product Name (${catName}):`); if(!name) return;
  let price=prompt('Price:','20'); if(!price) return;
  let target=selectedCat==='all'?'1':selectedCat;
  let obj={id:Date.now().toString(), name:name, price:parseFloat(price)||20, cat:target, qty:0, img:''};
  const input=document.getElementById('imgInput');
  if(input && confirm('Photo add karna hai?')){
    input.onchange=(e)=>{
      const file=e.target.files[0];
      if(file){
        const r=new FileReader();
        r.onload=()=>{
          obj.img=r.result;
          window.products.push(obj);
          saveLocal();
          if(window.firebaseAddProduct) window.firebaseAddProduct(obj);
          renderProducts(); renderCategories();
        };
        r.readAsDataURL(file);
      } else {
        window.products.push(obj);
        saveLocal();
        if(window.firebaseAddProduct) window.firebaseAddProduct(obj);
        renderProducts(); renderCategories();
      }
    };
    input.click(); return;
  }
  window.products.push(obj);
  saveLocal();
  if(window.firebaseAddProduct) window.firebaseAddProduct(obj);
  renderProducts(); renderCategories();
}
function addNewItemInCat(){ addItemDirect(); }

function deleteProductById(id){
  let p=(window.products||[]).find(x=>String(x.id)===String(id) || String(x.firebaseId)===String(id));
  if(p && p.firebaseId && window.firebaseDeleteProduct){
    if(!confirm(`"${p.name}" delete karna hai?`)) return;
    window.firebaseDeleteProduct(p.firebaseId);
  } else {
    if(!confirm('Delete product?')) return;
    window.products=(window.products||[]).filter(x=>String(x.id)!==String(id) && String(x.firebaseId)!==String(id));
    saveLocal();
    renderProducts(); renderCategories(); updateTotal();
  }
}
function deleteCategory(id){
  if(id==='all'){alert('All Items delete nahi hoga!'); return;}
  let c=(window.categories||[]).find(x=>String(x.id)===String(id) || String(x.firebaseId)===String(id));
  if(c && c.firebaseId && window.firebaseDeleteCategory){
    window.firebaseDeleteCategory(c.firebaseId);
  } else {
    if(!confirm(`Category "${c?c.name:id}" delete karna hai?`)) return;
    window.categories=window.categories.filter(x=>String(x.id)!==String(id) && String(x.firebaseId)!==String(id));
    window.products=(window.products||[]).filter(p=>String(p.cat)!==String(id));
    if(selectedCat===id) selectedCat='all';
    saveLocal();
    renderCategories(); renderProducts();
  }
}

function incQty(id){ cart[id]=(cart[id]||0)+1; updateTotal(); renderProducts(); renderPreview(); }
function decQty(id){ if(!cart[id]) return; cart[id]--; if(cart[id]<=0) delete cart[id]; updateTotal(); renderProducts(); renderPreview(); }
function updateTotal(){
  let total=0;
  Object.keys(cart).forEach(id=>{ let prod=(window.products||[]).find(p=>p.id===id || p.firebaseId===id); if(prod) total+=prod.price*cart[id]; });
  const el=document.getElementById('totalAmt'); if(el) el.innerText='₹'+total.toFixed(1);
}
function handleKOT(){ alert('KOT Printed'); }
function handlePreview(){ renderPreview(); document.getElementById('previewModal')?.classList.remove('hidden'); }
function closePreview(){ document.getElementById('previewModal')?.classList.add('hidden'); }
function renderPreview(){
  const list=document.getElementById('previewList'); if(!list) return;
  list.innerHTML=''; let total=0;
  Object.keys(cart).forEach(id=>{ let prod=(window.products||[]).find(p=>p.id===id || p.firebaseId===id); if(!prod) return; total+=prod.price*cart[id]; const row=document.createElement('div'); row.className='flex justify-between border-b py-2 text-[13px]'; row.innerHTML=`<span>${prod.name} x${cart[id]}</span><span>₹${(prod.price*cart[id]).toFixed(1)}</span>`; list.appendChild(row); });
  const tot=document.getElementById('previewTotal'); if(tot) tot.innerText='₹'+total.toFixed(1);
}
function switchTab(tab){
  if(tab==='SETTINGS'){ 
    document.getElementById('settingsPage')?.classList.remove('hidden'); 
  } else if(tab==='REPORT'){
    alert('Report - Jaldi aayega!');
    document.getElementById('settingsPage')?.classList.add('hidden');
  } else if(tab==='PARTY'){
    alert('Party - Jaldi aayega!');
    document.getElementById('settingsPage')?.classList.add('hidden');
  } else {
    document.getElementById('settingsPage')?.classList.add('hidden');
  }
  if(tab==='BILL'){ closeDrawer(); }
}
function openDrawer(){ document.getElementById('leftDrawer')?.classList.remove('-translate-x-full'); document.getElementById('drawerOverlay')?.classList.remove('hidden'); }
function closeDrawer(){ document.getElementById('leftDrawer')?.classList.add('-translate-x-full'); document.getElementById('drawerOverlay')?.classList.add('hidden'); }
document.getElementById('menuBtn').onclick=openDrawer;
document.getElementById('drawerOverlay').onclick=closeDrawer;
document.getElementById('searchInput')?.addEventListener('input', (e)=>{ searchText=e.target.value; renderProducts(); });
document.getElementById('newCatBtn').onclick=()=>{
  let name=prompt('New Category name likho:'); if(!name) return;
  let obj={id:Date.now().toString(), name:name};
  window.categories.push(obj);
  saveLocal();
  if(window.firebaseAddCategory) window.firebaseAddCategory(obj);
  renderCategories();
};
function saveUPI(){ let v=document.getElementById('upiIdInput')?.value; if(v){ localStorage.setItem('upiId', v); alert('UPI Saved'); } }
</script>

<script>
// ================= BLUETOOTH LONG CONNECT - SAME AS YOUR FILE =================
let btDevice = null;
let btServer = null;
let btCharacteristic = null;
async function connectBluetooth(){
  try{
    const st=document.getElementById('printerStatus');
    if(st) st.innerText='Connecting...';
    btDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
    });
    btServer = await btDevice.gatt.connect();
    const services = await btServer.getPrimaryServices();
    for(let service of services){
      const chars = await service.getCharacteristics();
      for(let char of chars){
        if(char.properties.write || char.properties.writeWithoutResponse){
          btCharacteristic = char;
          break;
        }
      }
      if(btCharacteristic) break;
    }
    if(btCharacteristic){
      if(st){ st.innerText='Connected: '+btDevice.name; st.className='text-[10px] px-2 py-1 rounded-full bg-green-100 text-green-700'; }
      const pn=document.getElementById('printerName');
      if(pn) pn.innerText=btDevice.name;
      alert('Printer Connected! Ab direct print hoga bina Save as PDF ke');
    } else {
      alert('Printer mila par write support nahi');
    }
  }catch(err){
    const st=document.getElementById('printerStatus');
    if(st) st.innerText='Disconnected';
    alert('Bluetooth Error: '+err.message);
  }
}
document.getElementById('printBtn').onclick=()=>{ handlePreview(); };
const btBtn=document.getElementById('btConnectBtn');
if(btBtn) btBtn.onclick=connectBluetooth;
const btBtn2=document.getElementById('btConnectBtn2');
if(btBtn2) btBtn2.onclick=connectBluetooth;

      logoImg.src=r.result;
      logoImg.classList.remove('hidden');
      localStorage.setItem('shopLogo',r.result);
    };
    r.readAsDataURL(f);
  };
  let s=localStorage.getItem('shopLogo');

}

const app = initializeApp(firebaseConfig);

const prodCol = collection(db, "products");

window.firebaseAddProduct = async (obj)=>{

window.firebaseAddCategory = async (obj)=>{

};
window.firebaseDeleteProduct = async (fid)=>{
  try{ await deleteDoc(doc(db, "products", fid)); }catch(e){ alert('Delete error '+e.message); }
};
window.firebaseDeleteCategory = async (fid)=>{
  try{ await deleteDoc(doc(db, "categories", fid)); }catch(e){ alert('Delete error '+e.message); }
};

// Products Live - FIXED: don't overwrite if firebase empty and local has data
onSnapshot(prodCol, (snap)=>{
  let list = [];
  snap.forEach(d=>{ let data=d.data(); data.firebaseId=d.id; if(!data.id) data.id=d.id; list.push(data); });
  if(list.length>0 || (window.products||[]).length===0){
    window.products = list;
    if(list.length>0) localStorage.setItem('localProducts', JSON.stringify(list));
  }
  if(window.renderProducts) window.renderProducts();
  if(window.renderCategories) window.renderCategories();
});
// Categories Live
onSnapshot(catCol, (snap)=>{
  let list = [];
  snap.forEach(d=>{ let data=d.data(); data.firebaseId=d.id; if(!data.id) data.id=d.id; list.push(data); });
  if(list.length>0){
    window.categories = list;
    localStorage.setItem('localCategories', JSON.stringify(list));

});

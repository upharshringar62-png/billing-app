<script>
// ================= DATA =================
let categories = [
  {id:'all', name:'All Items'},
  {id:'1', name:'Shringar box'},
  {id:'2', name:'Face Wash'},
  {id:'3', name:'Derma Products'},
  {id:'4', name:'Hair Fall Control'},
  {id:'5', name:'Bangles'},
  {id:'6', name:'Serum'},
  {id:'7', name:'Flower Pot 3pcs'},
  {id:'8', name:'Sefty Pin'},
  {id:'9', name:'Bindi'},
  {id:'10', name:'Juda Pins'}
];

let products = [
  {id:'1', name:'Baby finger ring', price:18, cat:'1', qty:4},
  {id:'2', name:'Dulhan bindi', price:20, cat:'9', qty:5},
  {id:'3', name:'Premium Bindi 5pc', price:25, cat:'9', qty:1},
  {id:'4', name:'Suruchi Bindi plain', price:15, cat:'9', qty:2},
  {id:'5', name:'fancy stone bindi', price:10, cat:'9', qty:0},
  {id:'6', name:'juda', price:20, cat:'10', qty:0},
  {id:'7', name:'Bangle Set', price:80, cat:'5', qty:0},
  {id:'8', name:'Face Wash', price:120, cat:'2', qty:0}
];

let cart = {};
let selectedCat = 'all';
let searchText = '';

// ================= RENDER CATEGORIES =================
function renderCategories(){
  const el = document.getElementById('catList');
  el.innerHTML = '';
  categories.forEach(c=>{
    const div = document.createElement('div');
    div.className = 'flex items-center justify-between px-3 py-3 border-b hover:bg-gray-50 cursor-pointer';
    div.innerHTML = `
      <div>
        <div class="text-[13px] font-medium">${c.name}</div>
        <div class="text-[11px] text-gray-400">(0.0)</div>
      </div>
      <button class="text-gray-300">⋮</button>
    `;
    div.onclick = ()=>{
      selectedCat = c.id;
      renderProducts();
    };
    el.appendChild(div);
  });
}

// ================= RENDER PRODUCTS =================
function renderProducts(){
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  let filtered = products.filter(p=>{
    if(selectedCat!=='all' && p.cat!==selectedCat) return false;
    if(searchText && !p.name.toLowerCase().includes(searchText.toLowerCase())) return false;
    return true;
  });
  filtered.forEach(p=>{
    const qty = cart[p.id] || p.qty || 0;
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl border p-2 flex flex-col items-center relative';
    card.innerHTML = `
      <button class="absolute top-1 right-1 text-gray-300 text-[16px]">⋮</button>
      <div class="w-full h-[80px] bg-[#f6f7ff] rounded-lg flex items-center justify-center text-gray-300 text-2xl">
        🖼️
      </div>
      <div class="mt-2 text-[13px] font-bold text-center leading-tight min-h-[32px]">
        ${p.name}
      </div>
      <div class="mt-2 w-full flex items-center gap-1">
        <div class="flex-1 border border-dashed rounded px-2 py-1 text-[11px] font-bold text-center">
          ₹ ${p.price}.0
        </div>
        <div class="w-[50px] border border-dashed rounded flex items-center justify-center gap-1 px-1 py-1 bg-[#f6f7ff]">
          <button onclick="event.stopPropagation(); decQty('${p.id}')" class="w-5 h-5 bg-white rounded-full shadow text-[12px] font-bold">-</button>
          <span class="text-[11px] font-bold w-4 text-center">${qty}</span>
          <button onclick="event.stopPropagation(); incQty('${p.id}')" class="w-5 h-5 bg-[#2e3ae8] text-white rounded-full text-[12px] font-bold">+</button>
        </div>
      </div>
    `;
    card.onclick = ()=> incQty(p.id);
    grid.appendChild(card);
  });
}

// ================= QTY FUNCTIONS =================
function incQty(id){
  cart[id] = (cart[id]||0) + 1;
  // update product qty too
  let prod = products.find(p=>p.id===id);
  if(prod) prod.qty = cart[id];
  updateTotal();
  renderProducts();
  renderPreview();
}

function decQty(id){
  if(!cart[id]) return;
  cart[id] = cart[id] - 1;
  if(cart[id]<=0) delete cart[id];
  let prod = products.find(p=>p.id===id);
  if(prod) prod.qty = cart[id]||0;
  updateTotal();
  renderProducts();
  renderPreview();
}

function updateTotal(){
  let total = 0;
  let count = 0;
  Object.keys(cart).forEach(id=>{
    let prod = products.find(p=>p.id===id);
    if(prod){
      total += prod.price * cart[id];
      count += cart[id];
    }
  });
  document.getElementById('totalAmt').innerText = '₹'+total.toFixed(1);
}

function handleKOT(){
  alert('KOT Printed');
}

function handlePreview(){
  renderPreview();
  document.getElementById('previewModal').classList.remove('hidden');
}

function closePreview(){
  document.getElementById('previewModal').classList.add('hidden');
}

function renderPreview(){
  const list = document.getElementById('previewList');
  list.innerHTML = '';
  let total = 0;
  Object.keys(cart).forEach(id=>{
    let prod = products.find(p=>p.id===id);
    if(!prod) return;
    total += prod.price * cart[id];
    const row = document.createElement('div');
    row.className = 'flex items-center justify-between border-b py-2';
    row.innerHTML = `
      <div class="flex-1">
        <div class="text-[13px] font-medium">${prod.name}</div>
        <div class="text-[11px] text-gray-500">₹${prod.price} x ${cart[id]} = ₹${prod.price*cart[id]}</div>
      </div>
      <div class="flex items-center gap-1 bg-gray-100 rounded-full px-1 py-1">
        <button onclick="decQty('${id}')" class="w-7 h-7 bg-white rounded-full shadow font-bold">-</button>
        <span class="w-6 text-center text-[12px] font-bold">${cart[id]}</span>
        <button onclick="incQty('${id}')" class="w-7 h-7 bg-[#2e3ae8] text-white rounded-full font-bold">+</button>
      </div>
    `;
    list.appendChild(row);
  });
  document.getElementById('previewTotal').innerText = '₹'+total.toFixed(1);
  if(Object.keys(cart).length===0){
    list.innerHTML = '<div class="text-center text-gray-400 text-[13px] mt-10">No items</div>';
  }
}

// ================= TABS =================
function switchTab(tab){
  if(tab==='SETTINGS'){
    document.getElementById('settingsPage').classList.remove('hidden');
  } else {
    document.getElementById('settingsPage').classList.add('hidden');
  }
  if(tab==='BILL'){
    closeDrawer();
  }
}

// ================= DRAWER =================
function openDrawer(){
  document.getElementById('leftDrawer').classList.remove('-translate-x-full');
  document.getElementById('drawerOverlay').classList.remove('hidden');
}
function closeDrawer(){
  document.getElementById('leftDrawer').classList.add('-translate-x-full');
  document.getElementById('drawerOverlay').classList.add('hidden');
}

document.getElementById('menuBtn').onclick = openDrawer;
document.getElementById('drawerOverlay').onclick = closeDrawer;

// ================= SEARCH =================
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchText = e.target.value;
  renderProducts();
});

// ================= BLUETOOTH LONG CONNECT =================
let btDevice = null;
let btServer = null;
let btCharacteristic = null;
let keepAliveInterval = null;

async function connectBluetooth(){
  try{
    document.getElementById('printerStatus').innerText = 'Connecting...';
    document.getElementById('printerStatus').className = 'text-[10px] px-2 py-1 rounded-full bg-yellow-100 text-yellow-700';
    
    // Request device
    btDevice = await navigator.bluetooth.requestDevice({
      filters: [{namePrefix: 'PSF'}, {namePrefix: 'MTP'}, {namePrefix: 'Printer'}],
      optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
    });
    
    btDevice.addEventListener('gattserverdisconnected', onDisconnected);
    
    btServer = await btDevice.gatt.connect();
    document.getElementById('printerStatus').innerText = 'Connected';
    document.getElementById('printerStatus').className = 'text-[10px] px-2 py-1 rounded-full bg-green-100 text-green-700';
    document.getElementById('printerName').innerText = btDevice.name;
    
    // Keep alive every 15 sec
    if(keepAliveInterval) clearInterval(keepAliveInterval);
    keepAliveInterval = setInterval(async ()=>{
      try{
        if(btServer && btServer.connected){
          // ping to keep alive
          console.log('Keep alive ping');
        } else {
          await reconnectBluetooth();
        }
      }catch(e){}
    }, 15000);
    
  }catch(err){
    document.getElementById('printerStatus').innerText = 'Disconnected';
    document.getElementById('printerStatus').className = 'text-[10px] px-2 py-1 rounded-full bg-red-100 text-red-600';
    alert('Bluetooth error: '+err.message);
  }
}

async function onDisconnected(){
  document.getElementById('printerStatus').innerText = 'Reconnecting...';
  await reconnectBluetooth();
}

async function reconnectBluetooth(){
  if(!btDevice) return;
  try{
    btServer = await btDevice.gatt.connect();
    document.getElementById('printerStatus').innerText = 'Connected';
    document.getElementById('printerStatus').className = 'text-[10px] px-2 py-1 rounded-full bg-green-100 text-green-700';
  }catch(e){
    document.getElementById('printerStatus').innerText = 'Disconnected';
  }
}

document.getElementById('btConnectBtn').onclick = connectBluetooth;

// ================= INIT =================
renderCategories();
renderProducts();
updateTotal();

</script>

<style>
*{
  font-family:Poppins,Arial,sans-serif;
}

.scrollbar-hide::-webkit-scrollbar{
  display:none;
}

@keyframes slideIn{
  from{transform:translateX(-100%)}
  to{transform:translateX(0)}
}

.animate-slide{
  animation:slideIn .25s ease;
}

@media print{
  body *{
    visibility:hidden!important;
  }

  #printArea,
  #printArea *{
    visibility:visible!important;
  }

  #printArea{
    position:absolute!important;
    left:0!important;
    top:0!important;
    width:100%!important;
    background:white!important;
    padding:10px;
  }

  header,
  nav,
  aside,
  #previewModal,
  #productActionModal,
  #editProductModal{
    display:none!important;
  }
}
</style>
</head>

<script type="module">

/* =====================================================
   PART 1 JAVASCRIPT
   Firebase database PART 2 me connect hoga.
   ===================================================== */


/* ================= BASIC DATA ================= */

window.products = [];

window.categories = [
  {
    id:'all',
    name:'All Items'
  }
];

let cart = {};

let selectedCat = 'all';

let searchText = '';

let selectedProductId = null;

let longPressTimer = null;


/* ================= RENDER CATEGORIES ================= */

window.renderCategories = function(){

  const el =
    document.getElementById('catList');

  if(!el) return;

  el.innerHTML = '';

  window.categories.forEach(c=>{

    const div =
      document.createElement('div');

    div.className =
      'flex items-center justify-between px-3 py-3 border-b cursor-pointer';


    div.innerHTML = `

      <div class="flex-1">

        <div class="text-[13px] font-medium">
          ${c.name}
        </div>

      </div>

      ${
        c.id !== 'all'
        ?
        `<button
          class="delete-cat-btn w-6 h-6 text-gray-400 text-[16px]">
          ⋮
        </button>`
        :
        ''
      }

    `;


    div.onclick = ()=>{

      selectedCat = c.id;

      renderProducts();

    };


    const deleteBtn =
      div.querySelector('.delete-cat-btn');


    if(deleteBtn){

      deleteBtn.onclick = (e)=>{

        e.stopPropagation();

        if(confirm(`Delete ${c.name}?`)){

          window.deleteCategoryFromFirebase(c.id);

        }

      };

    }


    el.appendChild(div);

  });

};


/* ================= RENDER PRODUCTS ================= */

window.renderProducts = function(){

  const grid =
    document.getElementById('productGrid');

  if(!grid) return;

  grid.innerHTML = '';


  let filtered =
    window.products.filter(p=>{

      if(
        selectedCat !== 'all' &&
        String(p.cat) !== String(selectedCat)
      ){
        return false;
      }


      if(
        searchText &&
        !String(p.name || '')
        .toLowerCase()
        .includes(searchText.toLowerCase())
      ){
        return false;
      }


      return true;

    });


  filtered.forEach(p=>{

    const qty =
      cart[p.id] || 0;


    const card =
      document.createElement('div');


    card.className =
      'bg-white rounded-xl border p-2 flex flex-col items-center relative';


    card.innerHTML = `

      <div class="w-full h-[80px] bg-[#f6f7ff] rounded-lg flex items-center justify-center overflow-hidden">

        ${
          p.img
          ?
          `<img
            src="${p.img}"
            class="w-full h-full object-cover">`
          :
          `<span class="text-3xl">🖼️</span>`
        }

      </div>


      <div class="mt-2 text-[13px] font-bold text-center leading-tight min-h-[32px]">

        ${p.name || 'Unnamed Product'}

      </div>


      <div class="mt-2 w-full flex items-center gap-1">

        <div class="flex-1 border border-dashed rounded px-2 py-1 text-[11px] font-bold text-center">

          ₹ ${Number(p.price || 0).toFixed(1)}

        </div>


        <div class="w-[70px] border border-dashed rounded flex items-center justify-center gap-1 px-1 py-1 bg-[#f6f7ff]">

          <button
            class="dec-btn w-5 h-5 bg-white rounded-full shadow text-[12px] font-bold">

            -

          </button>


          <span class="qty-text text-[11px] font-bold w-4 text-center">

            ${qty}

          </span>


          <button
            class="inc-btn w-5 h-5 bg-[#2e3ae8] text-white rounded-full text-[12px] font-bold">

            +

          </button>

        </div>

      </div>

    `;


    /* ================= QTY BUTTONS ================= */

    card.querySelector('.inc-btn').onclick =
      (e)=>{

        e.stopPropagation();

        incQty(p.id);

      };


    card.querySelector('.dec-btn').onclick =
      (e)=>{

        e.stopPropagation();

        decQty(p.id);

      };


    /* ================= NORMAL CLICK ================= */

    card.onclick = ()=>{

      incQty(p.id);

    };


    /* ================= LONG PRESS ================= */

    card.addEventListener(
      'mousedown',
      startLongPress
    );

    card.addEventListener(
      'touchstart',
      startLongPress,
      {passive:true}
    );


    card.addEventListener(
      'mouseup',
      cancelLongPress
    );

    card.addEventListener(
      'mouseleave',
      cancelLongPress
    );

    card.addEventListener(
      'touchend',
      cancelLongPress
    );


    function startLongPress(){

      longPressTimer =
        setTimeout(()=>{

          showActionModal(p.id);

        },600);

    }


    function cancelLongPress(){

      clearTimeout(longPressTimer);

    }


    grid.appendChild(card);

  });


  /* ================= NEW ITEM ================= */

  const newCard =
    document.createElement('div');

  newCard.className =
    'bg-white rounded-xl border border-dashed border-blue-400 p-2 flex flex-col items-center justify-center min-h-[140px] cursor-pointer';


  newCard.innerHTML = `

    <div class="w-16 h-16 rounded-full border-2 border-blue-500 flex items-center justify-center text-blue-500 text-[32px]">

      +

    </div>

    <div class="text-[14px] font-bold mt-3 text-blue-600">

      NEW ITEM

    </div>

  `;


  newCard.onclick =
    ()=>addProductToFirebase();


  grid.appendChild(newCard);

};


/* ================= QTY ================= */

function incQty(id){

  cart[id] =
    (cart[id] || 0) + 1;

  updateTotal();

  renderProducts();

  renderPreview();

}


function decQty(id){

  if(!cart[id]) return;

  cart[id]--;

  if(cart[id] <= 0){

    delete cart[id];

  }

  updateTotal();

  renderProducts();

  renderPreview();

}


function updateTotal(){

  let total = 0;

  Object.keys(cart).forEach(id=>{

    const p =
      window.products.find(
        x=>String(x.id) === String(id)
      );

    if(p){

      total +=
        Number(p.price || 0) *
        cart[id];

    }

  });


  document.getElementById('totalAmt')
    .innerText =
    '₹' + total.toFixed(1);

}


/* ================= PRODUCT ACTION ================= */

function showActionModal(id){

  selectedProductId = id;

  const p =
    window.products.find(
      x=>String(x.id) === String(id)
    );

  if(!p) return;


  document.getElementById(
    'actionProductName'
  ).innerText =
    `Do you want to modify '${p.name}'?`;


  document.getElementById(
    'productActionModal'
  ).classList.remove('hidden');


  document.getElementById(
    'productActionModal'
  ).classList.add('flex');

}


function closeActionModal(){

  const modal =
    document.getElementById(
      'productActionModal'
    );

  modal.classList.add('hidden');

  modal.classList.remove('flex');

}


/* ================= EDIT MODAL ================= */

function openModifyModal(){

  const p =
    window.products.find(
      x=>String(x.id) === String(selectedProductId)
    );

  if(!p) return;


  document.getElementById(
    'editProductName'
  ).value =
    p.name || '';


  document.getElementById(
    'editProductPrice'
  ).value =
    p.price || '';


  document.getElementById(
    'editProductImage'
  ).src =
    p.img || '';


  document.getElementById(
    'editProductImageInput'
  ).value = '';


  closeActionModal();


  document.getElementById(
    'editProductModal'
  ).classList.remove('hidden');

}


function closeEditModal(){

  document.getElementById(
    'editProductModal'
  ).classList.add('hidden');

}


/* ================= SEARCH ================= */

document.getElementById(
  'searchInput'
).addEventListener(
  'input',
  e=>{

    searchText =
      e.target.value;

    renderProducts();

  }
);


/* ================= CATEGORY UI ================= */

document.getElementById(
  'newCatBtn'
).onclick = ()=>{

  const name =
    prompt('New Category name likho:');

  if(!name || !name.trim())
    return;

  window.addCategoryToFirebase(
    name.trim()
  );

};


/* ================= FAB ================= */

document.getElementById(
  'addProductFab'
).onclick =
  ()=>addProductToFirebase();


/* ================= DRAWER ================= */

function openDrawer(){

  document.getElementById(
    'leftDrawer'
  ).classList.remove(
    '-translate-x-full'
  );

  document.getElementById(
    'drawerOverlay'
  ).classList.remove('hidden');

}


function closeDrawer(){

  document.getElementById(
    'leftDrawer'
  ).classList.add(
    '-translate-x-full'
  );

  document.getElementById(
    'drawerOverlay'
  ).classList.add('hidden');

}


document.getElementById(
  'menuBtn'
).onclick =
  openDrawer;


document.getElementById(
  'drawerOverlay'
).onclick =
  closeDrawer;


/* ================= TABS ================= */

function switchTab(tab){

  const settings =
    document.getElementById(
      'settingsPage'
    );

  if(tab === 'SETTINGS'){

    settings.classList.remove('hidden');

  }else{

    settings.classList.add('hidden');

  }

}


/* ================= PREVIEW ================= */

function handlePreview(){

  renderPreview();

  document.getElementById(
    'previewModal'
  ).classList.remove('hidden');

  document.getElementById(
    'previewModal'
  ).classList.add('flex');

}


function closePreview(){

  const modal =
    document.getElementById(
      'previewModal'
    );

  modal.classList.add('hidden');

  modal.classList.remove('flex');

}


function renderPreview(){

  const list =
    document.getElementById(
      'previewList'
    );

  list.innerHTML = '';

  let total = 0;


  Object.keys(cart).forEach(id=>{

    const p =
      window.products.find(
        x=>String(x.id) === String(id)
      );

    if(!p) return;


    const amount =
      Number(p.price || 0) *
      cart[id];


    total += amount;


    const row =
      document.createElement('div');


    row.className =
      'flex items-center justify-between border-b py-2';


    row.innerHTML = `

      <div class="flex-1">

        <div class="text-[13px] font-medium">
          ${p.name}
        </div>

        <div class="text-[11px] text-gray-500">

          ₹${p.price} × ${cart[id]}
          = ₹${amount}

        </div>

      </div>

    `;


    list.appendChild(row);

  });


  document.getElementById(
    'previewTotal'
  ).innerText =
    '₹' + total.toFixed(1);


  if(
    Object.keys(cart).length === 0
  ){

    list.innerHTML =
      '<div class="text-center text-gray-400 text-[13px] mt-10">No items</div>';

  }

}


/* ================= BASIC BUTTONS ================= */

function handleKOT(){

  alert('KOT Printed');

}


function handleRealPrint(){

  window.print();

}


/* ================= START ================= */

renderCategories();

renderProducts();

/* =====================================================
   IMAGE SELECT
===================================================== */

function selectProductImage(){

  return new Promise((resolve)=>{

    const input =
      document.createElement('input');

    input.type =
      'file';

    input.accept =
      'image/*';


    input.onchange =
      (event)=>{

        const file =
          event.target.files[0];


        if(!file){

          resolve("");

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          ()=>{
            resolve(
              reader.result
            );
          };


        reader.onerror =
          ()=>{
            resolve("");
          };


        reader.readAsDataURL(
          file
        );

      };


    input.click();

  });

}

/* =====================================================
   FILE TO BASE64
===================================================== */

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload =
        ()=>{
          resolve(
            reader.result
          );
        };


      reader.onerror =
        ()=>{
          reject(
            reader.error
          );
        };


      reader.readAsDataURL(
        file
      );

    }
  );

}

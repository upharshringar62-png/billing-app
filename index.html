<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPHAR Billing</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Poppins,sans-serif; touch-action:manipulation} .scroll-hide::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#f2f3f7] pb-[70px]">

<header class="bg-[#2e3ae8] h-[56px] flex items-center justify-between px-3 text-white sticky top-0 z-20">
<button id="menuBtn" class="text-[24px]">☰</button>
<button onclick="handlePreview()" class="bg-[#00c853] px-4 py-2 rounded-full text-[12px] font-bold">🖨️ PRINT</button>
</header>

<div class="flex">
<aside class="w-[120px] bg-white min-h-screen border-r">
<button id="newCatBtn" class="bg-[#2e3ae8] text-white text-[9px] px-3 py-1 rounded-full m-2 font-bold">+ NEW CATEGORY</button>
<div id="catList"></div>
</aside>
<main class="flex-1 p-2">
<input id="searchInput" placeholder="Search item..." class="w-full h-10 bg-white rounded-full px-4 text-[13px] border mb-2 outline-none">
<div id="productGrid" class="grid grid-cols-2 gap-2"></div>
</main>
</div>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t h-[60px] flex z-30">
<button onclick="alert('New Bill')" class="flex-1 text-[#2e3ae8] text-[10px] font-bold">📄<br>NEW BILL</button>
<button onclick="alert('Report jaldi aayega')" class="flex-1 text-gray-400 text-[10px]">📊<br>REPORT</button>
<button id="addProductFab" onclick="addProductWithCategory()" class="flex-1 flex flex-col items-center justify-center -mt-4"><span class="w-14 h-14 bg-[#2e3ae8] text-white rounded-full flex items-center justify-center text-[24px] shadow-lg">+</span><span class="text-[8px] mt-1">Product Add +</span></button>
<button onclick="alert('Party jaldi aayega')" class="flex-1 text-gray-400 text-[10px]">👥<br>PARTY</button>
<button onclick="document.getElementById('settingsPage').classList.remove('hidden')" class="flex-1 text-gray-400 text-[10px]">⚙️<br>SETTINGS</button>
</nav>

<input type="file" id="imgInput" accept="image/*" hidden>
<input type="file" id="logoInput" accept="image/*" hidden>

<div id="drawerOverlay" class="fixed inset-0 bg-black/30 z-40 hidden"></div>
<div id="leftDrawer" class="fixed left-0 top-0 bottom-0 w-[80%] max-w-[300px] bg-white z-50 -translate-x-full transition-all duration-200">
<div class="bg-[#2c3ac8] text-white p-4 text-[11px]">NARKATIAGANJ 845455<br>MOB +917256050678<br><span class="bg-green-500 px-2 py-1 rounded-full text-[9px] mt-2 inline-block">LOGGED IN : ADMIN</span></div>
<div class="p-4">
<div class="text-[12px] font-bold">Bluetooth Printer</div>
<div id="printerStatus" class="text-[10px] bg-gray-100 px-2 py-1 rounded-full mt-1">Disconnected</div>
<div id="printerName" class="text-[10px] mt-1"></div>
<button id="btConnectBtn" class="bg-[#2e3ae8] text-white px-3 py-1 rounded text-[10px] mt-2">Connect Printer</button>
<div class="mt-6"><div class="text-[11px] font-bold">Shop Logo</div><div id="logoBox" class="w-16 h-16 bg-gray-100 rounded flex items-center justify-center mt-1"><span id="logoIcon">🏪</span><img id="logoImg" class="hidden w-full h-full object-cover"></div><button onclick="document.getElementById('logoInput').click()" class="bg-blue-600 text-white px-3 py-1 rounded text-[10px] mt-2">Change Logo</button></div>
</div>
</div>

<div id="settingsPage" class="fixed inset-0 bg-white z-[60] hidden"><div class="bg-[#2e3ae8] h-14 flex items-center px-4 text-white"><button onclick="document.getElementById('settingsPage').classList.add('hidden')" class="mr-3">←</button><b>Settings</b></div><div class="p-4"><button onclick="document.getElementById('logoInput').click()" class="w-full h-11 border rounded-lg font-bold text-[13px]">Change Logo</button><div id="printerStatus2" class="text-center text-[11px] mt-4">Disconnected</div><button id="btConnectBtn2" class="w-full h-11 bg-[#2e3ae8] text-white rounded-lg mt-2 font-bold">Connect Bluetooth Printer</button></div></div>

<div id="previewModal" class="fixed inset-0 bg-black/40 z-[70] hidden flex items-end"><div class="bg-white w-full rounded-t-2xl p-4 max-h-[80%] overflow-auto"><div class="flex justify-between"><b>Bill Preview</b><button onclick="document.getElementById('previewModal').classList.add('hidden')">X</button></div><div id="previewList" class="mt-3"></div><div class="flex justify-between font-bold border-t mt-3 pt-2"><span>Total</span><span id="previewTotal">₹0.0</span></div><input id="billNoInput" placeholder="Bill No" class="w-full h-9 border rounded px-2 mt-3 text-[12px]"><input id="custName" placeholder="Customer Name" class="w-full h-9 border rounded px-2 mt-2 text-[12px]"><input id="custMobile" placeholder="Mobile" class="w-full h-9 border rounded px-2 mt-2 text-[12px]"><button onclick="handleRealPrint()" class="w-full bg-[#00c853] text-white h-10 rounded-full mt-4 font-bold">PRINT</button></div></div>
<div id="printArea" class="hidden"></div>
<span id="totalAmt" class="hidden">₹0.0</span>

<script>
// ===== DATA =====
let categories = JSON.parse(localStorage.getItem('uphar_cat')||'null') || [
{id:'all',name:'All Items'},{id:'1',name:'Shringar box'},{id:'2',name:'Face Wash'},{id:'3',name:'Derma Products'},{id:'4',name:'Hair Fall Control'},{id:'5',name:'Bangles'}
];
let products = JSON.parse(localStorage.getItem('uphar_prod')||'null') || [];
let cart={}; let selectedCat='all'; let searchText='';
function saveAll(){ localStorage.setItem('uphar_cat', JSON.stringify(categories)); localStorage.setItem('uphar_prod', JSON.stringify(products)); }

// ===== CATEGORY RENDER =====
function renderCategories(){
let el=document.getElementById('catList'); el.innerHTML='';
categories.forEach(c=>{
let div=document.createElement('div');
div.className='flex justify-between items-center px-3 py-3 border-b text-[13px] '+(selectedCat===c.id?'bg-blue-50':'');
let count=c.id==='all'?products.length:products.filter(p=>String(p.cat)===String(c.id)).length;
div.innerHTML=`<div onclick="selectedCat='${c.id}';renderCategories();renderProducts();" class="flex-1 cursor-pointer"><div class="font-medium">${c.name}</div><div class="text-[10px] text-gray-400">(${count}.0)</div></div><button onclick="deleteCategory('${c.id}')" class="text-gray-400 px-2">...</button>`;
el.appendChild(div);
});
}

// ===== PRODUCT RENDER - GREEN HIGHLIGHT =====
function renderProducts(){
let grid=document.getElementById('productGrid'); grid.innerHTML='';
let filtered=products.filter(p=>{
if(selectedCat!=='all' && String(p.cat)!==String(selectedCat)) return false;
if(searchText && !p.name.toLowerCase().includes(searchText.toLowerCase())) return false;
return true;
});
filtered.forEach(p=>{
let qty=cart[p.id]||0; let sel=qty>0;
let card=document.createElement('div');
card.className=(sel?'bg-[#c6f6c5] border-green-500 ':'bg-white border-gray-200 ')+'rounded-xl border-2 p-2 min-h-[170px] flex flex-col';
card.innerHTML=`
<div class="flex justify-between text-[11px] font-bold"><span class="border border-dashed px-2 py-1 rounded bg-white">₹ ${Number(p.price).toFixed(1)}</span><span class="border border-dashed px-2 py-1 rounded bg-white">${qty}</span></div>
<div class="flex-1 flex items-center justify-center my-2">${p.img?`<img src="${p.img}" class="w-20 h-20 object-contain">`:`<div class="w-20 h-20 bg-gray-100 flex items-center justify-center rounded">🖼️</div>`}</div>
<div class="text-[13px] font-bold text-center">${p.name}</div>
<div class="flex justify-between mt-2"><button onclick="deleteProductById('${p.id}')" class="border border-black w-6 h-6 rounded text-[10px] font-bold">X</button><div class="flex items-center gap-1"><button onclick="event.stopPropagation();decQty('${p.id}')" class="w-6 h-6 bg-white border rounded-full text-[12px]">-</button><button onclick="event.stopPropagation();incQty('${p.id}')" class="w-6 h-6 bg-[#2e3ae8] text-white rounded-full text-[12px]">+</button></div></div>
`;
card.onclick=()=>{incQty(p.id)};
grid.appendChild(card);
});
let newCard=document.createElement('div');
newCard.className='bg-white rounded-xl border-2 border-dashed border-blue-400 min-h-[170px] flex flex-col items-center justify-center cursor-pointer active:bg-blue-50';
newCard.innerHTML=`<div class="w-14 h-14 border-2 border-blue-500 rounded-full flex items-center justify-center text-blue-500 text-[30px]">+</div><div class="text-blue-600 font-bold text-[13px] mt-2">NEW ITEM</div>`;
newCard.onclick=()=>{addNewItemInCat()};
grid.appendChild(newCard);
}

// ===== ADD PRODUCT - FIXED =====
function addProductWithCategory(){
let list=categories.map((c,i)=>`${i+1}. ${c.name}`).join('\n');
let ch=prompt('Kis Category me add karna hai?\n\n'+list+'\n\nNumber likho:'); if(!ch) return;
let idx=parseInt(ch)-1; if(idx<0||idx>=categories.length) return;
let target=categories[idx].id; if(target==='all') target='1';
let name=prompt('Product name:'); if(!name) return;
let price=prompt('Price:','20'); if(!price) return;
let obj={id:Date.now().toString(), name:name.trim(), price:parseFloat(price)||20, cat:target, img:''};
let input=document.getElementById('imgInput');
if(confirm('Photo add karna hai?') && input){
input.onchange=(e)=>{
let file=e.target.files[0];
if(file){ let r=new FileReader(); r.onload=()=>{ obj.img=r.result; products.push(obj); saveAll(); renderProducts(); renderCategories(); }; r.readAsDataURL(file); }
else { products.push(obj); saveAll(); renderProducts(); renderCategories(); }
};
input.value=''; input.click(); return;
}
products.push(obj); saveAll(); renderProducts(); renderCategories();
}
function addNewItemInCat(){
let target=selectedCat==='all'?'1':selectedCat;
let name=prompt('Product Name:'); if(!name) return;
let price=prompt('Price:','20'); if(!price) return;
let obj={id:Date.now().toString(), name:name.trim(), price:parseFloat(price)||20, cat:target, img:''};
let input=document.getElementById('imgInput');
if(confirm('Photo add karna hai?') && input){
input.onchange=(e)=>{
let file=e.target.files[0];
if(file){ let r=new FileReader(); r.onload=()=>{ obj.img=r.result; products.push(obj); saveAll(); renderProducts(); renderCategories(); }; r.readAsDataURL(file); }
else { products.push(obj); saveAll(); renderProducts(); renderCategories(); }
};
input.value=''; input.click(); return;
}
products.push(obj); saveAll(); renderProducts(); renderCategories();
}

// ===== DELETE - FIXED =====
function deleteProductById(id){
if(!confirm('Product delete karna hai?')) return;
products=products.filter(p=>String(p.id)!==String(id));
delete cart[id];
saveAll();
renderProducts(); renderCategories(); updateTotal(); renderPreview();
}
function deleteCategory(id){
if(id==='all'){ alert('All Items delete nahi hoga'); return; }
if(!confirm('Category delete karna hai? Iske saare products bhi hatenge!')) return;
categories=categories.filter(c=>String(c.id)!==String(id));
products=products.filter(p=>String(p.cat)!==String(id));
if(selectedCat===id) selectedCat='all';
saveAll(); renderCategories(); renderProducts();
}

function incQty(id){ cart[id]=(cart[id]||0)+1; updateTotal(); renderProducts(); renderPreview(); }
function decQty(id){ if(!cart[id]) return; cart[id]--; if(cart[id]<=0) delete cart[id]; updateTotal(); renderProducts(); renderPreview(); }
function updateTotal(){ let t=0; Object.keys(cart).forEach(id=>{ let p=products.find(x=>x.id===id); if(p) t+=p.price*cart[id]; }); let el=document.getElementById('totalAmt'); if(el) el.innerText='₹'+t.toFixed(1); let pt=document.getElementById('previewTotal'); if(pt) pt.innerText='₹'+t.toFixed(1); }
function handlePreview(){ renderPreview(); document.getElementById('previewModal').classList.remove('hidden'); }
function renderPreview(){ let list=document.getElementById('previewList'); if(!list) return; list.innerHTML=''; let total=0; Object.keys(cart).forEach(id=>{ let p=products.find(x=>x.id===id); if(!p) return; total+=p.price*cart[id]; let r=document.createElement('div'); r.className='flex justify-between border-b py-2 text-[13px]'; r.innerHTML=`<span>${p.name} x${cart[id]}</span><span>₹${(p.price*cart[id]).toFixed(1)}</span>`; list.appendChild(r); }); document.getElementById('previewTotal').innerText='₹'+total.toFixed(1); }
function handleKOT(){ alert('KOT Printed'); }

// ===== DRAWER =====
function openDrawer(){ document.getElementById('leftDrawer').classList.remove('-translate-x-full'); document.getElementById('drawerOverlay').classList.remove('hidden'); }
function closeDrawer(){ document.getElementById('leftDrawer').classList.add('-translate-x-full'); document.getElementById('drawerOverlay').classList.add('hidden'); }
document.getElementById('menuBtn').onclick=openDrawer;
document.getElementById('drawerOverlay').onclick=closeDrawer;
document.getElementById('searchInput').addEventListener('input', e=>{ searchText=e.target.value; renderProducts(); });
document.getElementById('newCatBtn').onclick=()=>{ let n=prompt('New Category name:'); if(!n) return; categories.push({id:Date.now().toString(), name:n.trim()}); saveAll(); renderCategories(); };

// ===== BLUETOOTH - SAME CODE =====
let btDevice=null, btServer=null, btCharacteristic=null;
async function connectBluetooth(){
try{
let st=document.getElementById('printerStatus'); if(st) st.innerText='Connecting...';
btDevice=await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2']});
btServer=await btDevice.gatt.connect();
let services=await btServer.getPrimaryServices();
for(let s of services){ let chars=await s.getCharacteristics(); for(let ch of chars){ if(ch.properties.write||ch.properties.writeWithoutResponse){ btCharacteristic=ch; break; } } if(btCharacteristic) break; }
if(btCharacteristic){
document.getElementById('printerStatus').innerText='Connected: '+btDevice.name;
document.getElementById('printerStatus').className='text-[10px] px-2 py-1 rounded-full bg-green-100 text-green-700';
document.getElementById('printerName').innerText=btDevice.name;
let st2=document.getElementById('printerStatus2'); if(st2) st2.innerText='Connected: '+btDevice.name;
alert('Printer Connected!');
} else alert('Printer mila par write support nahi');
}catch(err){ document.getElementById('printerStatus').innerText='Disconnected'; alert('Bluetooth Error: '+err.message); }
}
document.getElementById('btConnectBtn').onclick=connectBluetooth;
let bt2=document.getElementById('btConnectBtn2'); if(bt2) bt2.onclick=connectBluetooth;
async function handleRealPrint(){
let billNo=document.getElementById('billNoInput')?.value||'655';
let custName=document.getElementById('custName')?.value||'';
let custMobile=document.getElementById('custMobile')?.value||'';
let now=new Date(); let dateStr=now.toLocaleString('en-IN');
let totalItems=0,totalQty=0,subtotal=0;
Object.keys(cart).forEach(id=>{ let p=products.find(x=>x.id==id); if(p){ totalItems++; totalQty+=cart[id]; subtotal+=p.price*cart[id]; } });
let savedLogo=localStorage.getItem('shopLogo')||'';
async function getLogoBytes(base64){
return new Promise(res=>{
let img=new Image();
img.onload=()=>{
let canvas=document.createElement('canvas'); let w=280; let h=Math.round((img.height/img.width)*w);
canvas.width=w; canvas.height=h; let ctx=canvas.getContext('2d');
ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
let data=ctx.getImageData(0,0,w,h).data; let bytes=[]; let xBytes=Math.ceil(w/8);
let xL=xBytes&0xFF, xH=(xBytes>>8)&0xFF, yL=h&0xFF, yH=(h>>8)&0xFF;
bytes.push(...[0x1D,0x76,0x30,0, xL, xH, yL, yH]);
for(let y=0;y<h;y++){ for(let xb=0; xb<xBytes; xb++){ let byte=0; for(let b=0;b<8;b++){ let x=xb*8+b; if(x>=w) continue; let idx=(y*w+x)*4; let gray=0.299*data[idx]+0.587*data[idx+1]+0.114*data[idx+2]; if(gray<120) byte|=(0x80>>b); } bytes.push(byte); } }
res(new Uint8Array(bytes));
};
img.onerror=()=>res(null); img.src=base64;
});
}
let t=''; t+=' UPHAR SINGHAR & GIFTS\n BHAGWATI CINEMA ROAD,\n NARKATIAGANJ, 845455\n MOB. +917256050678\n'; t+='--------------------------------\n'; t+=`Bill No:${billNo}\nDate:${dateStr}\n`; if(custName) t+=`Customer: ${custName}\n`; if(custMobile) t+=`Mob: ${custMobile}\n`; t+='Payment:DUE\n--------------------------------\nSr. Item Rate Qty Amt\n--------------------------------\n'; let sr=1; Object.keys(cart).forEach(id=>{ let p=products.find(x=>x.id==id); if(!p) return; t+=`${sr}.${p.name}`.padEnd(16,' ')+String(p.price).padStart(3,' ')+' '+String(cart[id]).padStart(2,' ')+' '+String((p.price*cart[id]).toFixed(1)).padStart(5,' ')+'\n'; sr++; }); t+='--------------------------------\n'; t+=`TOTAL ITEMS: ${totalItems}\nTOTAL QTY: ${totalQty}\nSubtotal: Rs. ${subtotal.toFixed(2)}\n--------------------------------\nGRAND TOTAL\nRs. ${subtotal.toFixed(2)}\n--------------------------------\n`;
if(btCharacteristic && btServer && btServer.connected){
try{
await btCharacteristic.writeValueWithoutResponse(new Uint8Array([0x1B,0x40]));
if(savedLogo){ let logoBytes=await getLogoBytes(savedLogo); if(logoBytes){ await btCharacteristic.writeValueWithoutResponse(new Uint8Array([0x1B,0x61,0x01])); for(let i=0;i<logoBytes.length;i+=80){ await btCharacteristic.writeValueWithoutResponse(logoBytes.slice(i,i+80)); await new Promise(r=>setTimeout(r,40)); } } }
await btCharacteristic.writeValueWithoutResponse(new Uint8Array([0x1B,0x61,0x00]));
let enc=new TextEncoder(); let data=enc.encode(t);
for(let i=0;i<data.length;i+=100){ await btCharacteristic.writeValueWithoutResponse(data.slice(i,i+100)); await new Promise(r=>setTimeout(r,30)); }
let upiId=localStorage.getItem('upiId')||'7256050678@ybl';
let upiString=`upi://pay?pa=${upiId}&am=${subtotal.toFixed(2)}&cu=INR`;
let len=upiString.length+3, pL=len&0xFF, pH=(len>>8)&0xFF, c=[];
c.push(...[0x1D,0x28,0x6B,0x04,0x00,0x31,0x41,0x32,0x00, 0x1D,0x28,0x6B,0x03,0x00,0x31,0x43,0x08, 0x1D,0x28,0x6B,0x03,0x00,0x31,0x45,0x30, 0x1D,0x28,0x6B,pL,pH,0x31,0x50,0x30]);
for(let i=0;i<upiString.length;i++) c.push(upiString.charCodeAt(i));
c.push(...[0x1D,0x28,0x6B,0x03,0x00,0x31,0x51,0x30]);
let qrBytes=new Uint8Array(c);
await btCharacteristic.writeValueWithoutResponse(new Uint8Array([0x1B,0x61,0x01]));
for(let i=0;i<qrBytes.length;i+=80){ await btCharacteristic.writeValueWithoutResponse(qrBytes.slice(i,i+80)); await new Promise(r=>setTimeout(r,40)); }
let foot=enc.encode("\nSCAN TO PAY\nThank You Visit Again!\n\n\n");
await btCharacteristic.writeValueWithoutResponse(foot);
document.getElementById('previewModal').classList.add('hidden');
}catch(e){ alert('Error: '+e.message); }
return;
}
let pa=document.getElementById('printArea'); if(!pa){ pa=document.createElement('div'); pa.id='printArea'; document.body.appendChild(pa); }
pa.innerHTML=`<pre>${t}</pre>`; window.print();
}
let logoInput=document.getElementById('logoInput');
let logoIcon=document.getElementById('logoIcon');
let logoImg=document.getElementById('logoImg');
if(logoInput){
logoInput.onchange=e=>{
let f=e.target.files[0]; if(!f) return;
let r=new FileReader(); r.onload=()=>{ if(logoIcon) logoIcon.style.display='none'; logoImg.src=r.result; logoImg.classList.remove('hidden'); localStorage.setItem('shopLogo',r.result); }; r.readAsDataURL(f);
};
let s=localStorage.getItem('shopLogo'); if(s){ if(logoIcon) logoIcon.style.display='none'; logoImg.src=s; logoImg.classList.remove('hidden'); }
}
renderCategories(); renderProducts(); updateTotal();
</script>
</body>
</html>
